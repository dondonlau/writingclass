<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>冬冬姨的写作基地</title>

    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">
    <meta name="apple-mobile-web-app-title" content="写作基地">
    <meta name="application-name" content="冬冬姨的写作基地">
    <meta name="theme-color" content="#7209b7">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', 'PingFang SC', sans-serif; }
        body { height: 100vh; display: flex; overflow: hidden; position: relative; }
        
        /* --- 顶部 Logo 区域 (带头像) --- */
        .main-logo-container {
            position: absolute; top: 0; left: 0; width: 100%;
            display: flex; justify-content: center; padding: 30px 0;
            z-index: 10; pointer-events: none; 
        }
        
        .main-logo {
            display: flex; align-items: center; gap: 15px;
            background: rgba(0, 0, 0, 0.2); padding: 10px 24px;
            border-radius: 40px; backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo-image {
            width: 45px; height: 45px; border-radius: 50%; object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.8);
        }

        .logo-text { font-size: 1.5rem; font-weight: 800; color: #ffffff; letter-spacing: 1px; }

        /* --- 左右分流门户样式 (桌面端默认) --- */
        .side {
            flex: 1; display: flex; flex-direction: column; justify-content: center;
            align-items: center; transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer; text-decoration: none; position: relative; pointer-events: auto;
        }
        
        .william { background: linear-gradient(135deg, #0a192f, #112240); color: #64ffda; border-right: 1px solid rgba(255,255,255,0.05); }
        .alice { background: linear-gradient(135deg, #2d0a0a, #4a0e0e); color: #ff6b6b; }
        .side:hover { flex: 1.5; }
        
        .tag { margin-bottom: 20px; padding: 6px 18px; border-radius: 20px; font-size: 0.85rem; font-weight: bold; border: 1px solid; letter-spacing: 1px; }
        .william .tag { border-color: #64ffda; color: #64ffda; background: rgba(100, 255, 218, 0.05); }
        .alice .tag { border-color: #ff6b6b; color: #ff6b6b; background: rgba(255, 107, 107, 0.05); }
        
        .side h1 { font-size: 4.5rem; margin-bottom: 1rem; margin-top: 80px; transition: transform 0.4s; text-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .side p { font-size: 1.2rem; opacity: 0.7; letter-spacing: 2px; text-transform: uppercase; text-align: center; padding: 0 20px; }
        .side:hover h1 { transform: scale(1.1); }

        /* =========================================
           📱 手机端自适应黑科技 (Mobile Responsive) 
           ========================================= */
        @media (max-width: 768px) {
            body {
                flex-direction: column; /* 把左右横排改成上下竖排 */
            }
            .side {
                width: 100%; 
                height: 50%; /* 每个人占据屏幕一半高度 */
            }
            .side:hover {
                flex: 1; /* 取消手机端点击时放大的动效，防止画面抖动 */
            }
            .side h1 {
                font-size: 3rem; /* 缩小标题字号 */
                margin-top: 10px; 
            }
            .side p {
                font-size: 1rem; /* 缩小副标题字号 */
            }
            
            /* 调整手机端顶部的 Logo，防止遮挡文字 */
            .main-logo-container {
                padding: 15px 0;
            }
            .main-logo {
                padding: 6px 16px;
            }
            .logo-text {
                font-size: 1.1rem;
            }
            .logo-image {
                width: 32px;
                height: 32px;
            }
            
            /* 给上半部分的 William 往下挪一点，给 Logo 留出空间 */
            .william {
                padding-top: 70px;
            }
        }
    </style>
</head>
<body>
    <div class="main-logo-container">
        <div class="main-logo">
            <img src="logo.png" alt="冬冬姨" class="logo-image">
            <span class="logo-text">冬冬姨的写作基地</span>
        </div>
    </div>

    <a href="william.html" class="side william">
        <div class="tag">AGENT TERMINAL</div>
        <h1>William</h1>
        <p>画面捕捉特工局</p>
    </a>

    <a href="alice.html" class="side alice">
        <div class="tag">CREATIVE STUDIO</div>
        <h1>Alice</h1>
        <p>独立研究与深度创作</p>
    </a>
</body>
</html>
