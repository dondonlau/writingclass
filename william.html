    <style>
        :root {
            --neon-cyan: #64ffda;
            --dark-bg: #020c1b;
            --panel-bg: rgba(17, 34, 64, 0.85); 
            --text-main: #ccd6f6;
            --text-muted: #8892b0;
            --neon-purple: #b392f0;
            --accent-orange: #ff9f43;
        }
        
        body { 
            background: linear-gradient(rgba(2, 12, 27, 0.9), rgba(2, 12, 27, 0.9)), 
                        url('bg-william.jpg') no-repeat center center fixed; 
            background-size: cover;
            color: var(--text-main); margin: 0; padding: 20px; font-family: 'Courier New', 'PingFang SC', monospace; line-height: 1.6; 
        }
        
        .dashboard { max-width: 1000px; margin: 0 auto; }
        
        /* 顶部状态栏 */
        .header { 
            display: flex; justify-content: space-between; align-items: center; 
            border-bottom: 2px solid var(--neon-cyan); padding-bottom: 15px; margin-bottom: 30px;
            background: rgba(100, 255, 218, 0.05); padding: 15px; border-radius: 8px 8px 0 0;
        }
        .back-home { 
            display: inline-flex; align-items: center; gap: 10px; padding: 8px 18px; 
            border: 1px solid var(--neon-cyan); color: var(--neon-cyan); text-decoration: none; 
            font-size: 0.9rem; border-radius: 4px; transition: 0.3s; 
        }
        .back-home:hover { background: var(--neon-cyan); color: var(--dark-bg); box-shadow: 0 0 20px var(--neon-cyan); }
        
        /* 播放列表选择区 */
        .playlist-container {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-bottom: 30px;
        }
        .video-card {
            background: var(--panel-bg); border: 1px solid #233554; border-radius: 12px; padding: 15px;
            cursor: pointer; transition: 0.3s; display: flex; align-items: center; gap: 15px;
        }
        .video-card:hover { border-color: var(--neon-cyan); background: rgba(100, 255, 218, 0.1); }
        .video-card.active { border-color: var(--neon-purple); border-width: 2px; box-shadow: 0 0 15px var(--neon-purple); }
        .video-card img { width: 100px; height: 60px; border-radius: 4px; object-fit: cover; border: 1px solid #333; }
        .video-card .v-info h4 { margin: 0; color: #fff; font-size: 1rem; }
        .video-card .v-info p { margin: 5px 0 0; font-size: 0.75rem; color: var(--text-muted); }

        /* 主面板 */
        .panel { background: var(--panel-bg); border: 1px solid #233554; border-radius: 12px; padding: 30px; margin-bottom: 40px; backdrop-filter: blur(15px); }
        
        .mission-header { display: flex; align-items: center; gap: 15px; margin-bottom: 25px; }
        .pulse-dot { width: 15px; height: 15px; background: var(--neon-purple); border-radius: 50%; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(179, 146, 240, 0.7); } 70% { transform: scale(1.1); box-shadow: 0 0 0 15px rgba(179, 146, 240, 0); } 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(179, 146, 240, 0); } }

        /* 视频播放窗口 */
        .video-wrapper { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 8px; border: 2px solid var(--neon-purple); margin-bottom: 40px; background: #000; }
        .video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        
        /* 任务块 */
        .task-block { margin-bottom: 40px; border-left: 4px solid var(--neon-purple); padding-left: 25px; position: relative; }
        .task-tag { position: absolute; left: -12px; top: 0; background: var(--neon-purple); color: var(--dark-bg); font-weight: bold; padding: 2px 8px; border-radius: 4px; font-size: 0.7rem; }
        .task-title { color: var(--neon-purple); font-weight: bold; font-size: 1.25rem; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
        .dongdong-box { background: rgba(100, 255, 218, 0.07); border: 1px solid var(--neon-cyan); padding: 15px 20px; border-radius: 8px; margin: 15px 0; color: var(--neon-cyan); font-size: 0.95rem; }
