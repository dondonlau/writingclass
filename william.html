<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>特工终端 - William [超级蜀道突围]</title>
    
    <link rel="icon" type="image/png" href="logo.png?v=9.2">
    <link rel="apple-touch-icon" href="logo.png?v=9.2">
    <meta name="apple-mobile-web-app-title" content="特工终端">
    <meta name="theme-color" content="#020c1b">

    <style>
        :root {
            --neon-cyan: #64ffda;
            --dark-bg: #020c1b;
            --panel-bg: rgba(17, 34, 64, 0.95); 
            --text-main: #ccd6f6;
            --text-muted: #8892b0;
            --neon-purple: #b392f0;
            --accent-orange: #ff9f43;
        }
        
        body { 
            background-color: var(--dark-bg);
            background: linear-gradient(rgba(2, 12, 27, 0.92), rgba(2, 12, 27, 0.92)), 
                        url('bg-william.jpg') no-repeat center center fixed; 
            background-size: cover;
            color: var(--text-main); margin: 0; padding: 20px; 
            font-family: 'Courier New', 'PingFang SC', monospace; line-height: 1.6; 
        }
        
        .container { max-width: 1000px; margin: 0 auto; }
        
        .header { 
            display: flex; justify-content: space-between; align-items: center; 
            border-bottom: 2px solid var(--neon-cyan); padding: 15px; margin-bottom: 30px;
            background: rgba(100, 255, 218, 0.05); border-radius: 8px;
        }

        .mission-title-box {
            background: var(--neon-cyan); color: var(--dark-bg); padding: 20px;
            border-radius: 12px 12px 0 0; text-align: center; font-size: 1.8rem;
            font-weight: bold; border: 2px solid #fff; border-bottom: none;
            box-shadow: 0 -10px 30px rgba(100, 255, 218, 0.5); position: relative; overflow: hidden;
        }

        .mission-title-box::before {
            content: ''; position: absolute; top: 0; left: -150%; width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.9), transparent);
            transform: skewX(-25deg); animation: sweepLight 3s infinite; 
        }

        @keyframes sweepLight { 0% { left: -150%; } 30% { left: 200%; } 100% { left: 200%; } }

        .mission-panel { 
            background: var(--panel-bg); border: 3px solid var(--neon-cyan); 
            border-radius: 0 0 12px 12px; padding: 30px; margin-bottom: 40px; 
            backdrop-filter: blur(10px); position: relative; z-index: 5;
        }

        /* 🚀 修复视频防盗链：外部链接跳转框样式 */
        .video-redirect-box {
            position: relative;
            width: 100%;
            height: 450px;
            border-radius: 8px;
            border: 2px dashed var(--neon-purple);
            margin-bottom: 40px;
            background: url('https://i.ytimg.com/vi/7GRhGvMJHkA/maxresdefault.jpg') center/cover no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        
        .video-redirect-box::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2, 12, 27, 0.75); /* 暗色遮罩让按钮更清晰 */
            z-index: 1;
        }

        .play-btn {
            position: relative;
            z-index: 10;
            padding: 20px 40px;
            background: rgba(179, 146, 240, 0.2);
            border: 2px solid var(--neon-purple);
            color: #fff;
            font-size: 1.5rem;
            font-weight: bold;
            text-decoration: none;
            border-radius: 12px;
            transition: 0.3s;
            box-shadow: 0 0 30px rgba(179, 146, 240, 0.4);
            backdrop-filter: blur(5px);
        }

        .play-btn:hover {
            background: var(--neon-purple);
            color: var(--dark-bg);
            box-shadow: 0 0 50px var(--neon-purple);
            transform: scale(1.05);
        }
        
        .task-card { margin-bottom: 45px; border-left: 5px solid var(--neon-purple); padding-left: 25px; }
        .task-title { color: var(--neon-purple); font-weight: bold; font-size: 1.35rem; margin-bottom: 12px; }
        
        .dongdong-box { 
            background: rgba(100, 255, 218, 0.07); border: 1px solid var(--neon-cyan); 
            padding: 18px 25px; border-radius: 8px; margin: 15px 0; color: var(--neon-cyan); 
            font-size: 1.05rem; line-height: 1.8; font-weight: bold;
        }

        .blank-group { margin-bottom: 22px; font-size: 1.15rem; color: #fff; line-height: 2; }
        .blank-input { 
            background: transparent; border: none; border-bottom: 2px solid var(--neon-cyan); 
            color: var(--accent-orange); width: 160px; text-align: center; 
            font-family: inherit; font-size: 1.15rem; font-weight: bold; outline: none; 
            transition: 0.3s;
        }
        .blank-input:focus { border-bottom-color: var(--neon-purple); box-shadow: 0 4px 10px rgba(179,146,240,0.2); }

        .vocab-box {
            background: rgba(2, 12, 27, 0.5); padding: 15px; border-radius: 8px;
            border: 1px dashed var(--neon-purple); margin-bottom: 20px;
        }
        .vocab-word { font-size: 1.2rem; color: #fff; font-weight: bold; background: var(--neon-purple); padding: 2px 10px; border-radius: 4px; margin-right: 10px; }

        .cipher-input { 
            width: 100%; background: rgba(2, 12, 27, 0.85); border: 1px solid #233554; 
            color: var(--neon-cyan); padding: 20px; font-family: inherit; font-size: 1.15rem; 
            border-radius: 8px; outline: none; resize: vertical; min-height: 150px; 
            line-height: 1.8; box-sizing: border-box; transition: 0.4s; margin-top: 10px;
        }
        .cipher-input:focus { border-color: var(--neon-purple); background: rgba(2, 12, 27, 0.95); }

        .submit-btn { 
            width: 100%; padding: 25px; background: transparent; border: 3px solid var(--neon-purple); 
            color: var(--neon-purple); font-family: inherit; font-size: 1.5rem; font-weight: bold; 
            cursor: pointer; border-radius: 8px; transition: 0.3s; letter-spacing: 4px; margin-top: 20px;
        }
        .submit-btn:hover { background: var(--neon-purple); color: var(--dark-bg); box-shadow: 0 0 30px var(--neon-purple); }
        
        .back-home { color: var(--neon-cyan); text-decoration: none; border: 1px solid var(--neon-cyan); padding: 5px 15px; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <a href="index.html" class="back-home">🏡 冬冬姨的写作基地</a>
