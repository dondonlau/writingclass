<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>特工终端 - William</title>
    <style>
        /* 基础特工暗黑风 */
        :root {
            --neon-cyan: #64ffda;
            --dark-bg: #020c1b;
            --panel-bg: #112240;
            --text-main: #ccd6f6;
            --text-muted: #8892b0;
        }
        body { background-color: var(--dark-bg); color: var(--text-main); margin: 0; padding: 20px; font-family: 'Courier New', Courier, monospace; line-height: 1.6; }
        .dashboard { max-width: 1000px; margin: 0 auto; }
        
        /* 顶部导航与档案 */
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--neon-cyan); padding-bottom: 15px; margin-bottom: 30px; flex-wrap: wrap; gap: 15px; }
        .back-home { display: inline-flex; align-items: center; gap: 10px; padding: 8px 15px; border: 1px solid var(--neon-cyan); color: var(--neon-cyan); text-decoration: none; font-size: 0.9rem; border-radius: 4px; transition: all 0.3s; background: rgba(100, 255, 218, 0.05); }
        .back-home:hover { background: var(--neon-cyan); color: var(--dark-bg); box-shadow: 0 0 10px var(--neon-cyan); }
        .back-home img { width: 24px; height: 24px; border-radius: 50%; }
        .agent-status { text-align: right; font-size: 0.9rem; }
        .agent-status span { color: var(--neon-cyan); font-weight: bold; }

        /* 核心任务区 */
        .active-mission { background: var(--panel-bg); border: 1px solid #233554; border-radius: 8px; padding: 25px; margin-bottom: 30px; position: relative; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        /* 任务运行中的扫描线动画特效 */
        .active-mission::before { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 2px; background: var(--neon-cyan); box-shadow: 0 0 10px var(--neon-cyan); animation: scanline 3s linear infinite; opacity: 0.5; }
        @keyframes scanline { 0% { top: 0; } 100% { top: 100%; } }

        .mission-title { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        .pulse-dot { width: 10px; height: 10px; background: #ff4d4d; border-radius: 50%; box-shadow: 0 0 10px #ff4d4d; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 77, 77, 0.7); } 70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(255, 77, 77, 0); } 100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 77, 77, 0); } }

        .mission-content { display: grid; grid-template-columns: 1fr; gap: 20px; }
        .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 6px; border: 1px solid #233554; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        
        .briefing { background: rgba(2, 12, 27, 0.7); padding: 15px; border-radius: 6px; border-left: 4px solid var(--neon-cyan); }
        
        /* 提交通道 */
        .upload-terminal { background: var(--panel-bg); border-radius: 8px; padding: 25px; border: 1px dashed var(--text-muted); }
        .upload-terminal h3 { color: var(--neon-cyan); margin-top: 0; }
        .form-container iframe { width: 100%; height: 500px; border: none; border-radius: 6px; background: white; } /* 表单背景设为白色以适配第三方工具 */

        /* 历史存档区 */
        .archive-section { margin-top: 40px; border-top: 1px solid #233554; padding-top: 20px; }
        .archive-item { padding: 10px; border-bottom: 1px solid #233554; color: var(--text-muted); display: flex; justify-content: space-between; }
        .archive-item:hover { background: rgba(100, 255, 218, 0.05); color: var(--text-main); cursor: pointer; }

        /* 手机端适配 */
        @media (max-width: 768px) {
            .header { flex-direction: column; align-items: flex-start; }
            .agent-status { text-align: left; margin-top: 10px; }
        }
    </style>
</head>
<body>
    <div class="dashboard">
        
        <header class="header">
            <a href="index.html" class="back-home">
                <img src="logo.png" alt="logo">
                ⬅ 撤退至基地
            </a>
            <div class="agent-status">
                <div>身份识别: <span>AGENT WILLIAM</span></div>
                <div>安全等级: <span>LEVEL 1 (见习观察员)</span></div>
                <div>系统状态: <span style="color: #4cd137;">在线</span></div>
            </div>
        </header>

        <section class="active-mission">
            <div class="mission-title">
                <div class="pulse-dot"></div>
                <h2 style="margin:0; color: white;">ACTIVE MISSION: 001 - 破译超级工程</h2>
            </div>
            
            <div class="mission-content">
                <div class="briefing">
                    <strong style="color: var(--neon-cyan);">▶ 情报简报：</strong><br>
                    特工 William，本次任务需要你潜入花江大峡谷。请仔细观看影像资料，注意解说员使用了什么“超级参照物”来替换枯燥的数字。
                </div>
                
                <div class="video-container">
                    <iframe src="https://www.youtube.com/embed/9-aUcW0Umc8" title="YouTube video player" allowfullscreen></iframe>
                </div>
            </div>
        </section>

        <section class="upload-terminal">
            <h3>📡 情报数据上传接口</h3>
            <p style="font-size: 0.9rem; color: var(--text-muted);">请在下方终端录入你破译的“画面替换术”密码。确认无误后点击发射。</p>
            
            <div class="form-container">
                <iframe src="您的表单链接?transparentBackground=1"></iframe>
            </div>
        </section>

        <section class="archive-section">
            <h3 style="color: var(--text-muted);">📁 已解密档案室 (ARCHIVES)</h3>
            <div class="archive-item">
                <span>[系统提示]</span>
                <span>暂无历史任务，期待特工凯旋。</span>
            </div>
            </section>

    </div>
</body>
</html>
