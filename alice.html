<script>
    const setupForm = (formId, btnId, msg, title) => {
        const form = document.getElementById(formId);
        const btn = document.getElementById(btnId);
        const modal = document.getElementById('successModal');
        const modalBox = document.getElementById('modalBox');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            btn.innerText = '正在加密打包思想碎片...';
            btn.style.opacity = '0.7';

            try {
                const response = await fetch("https://formspree.io/f/mrergerg", {
                    method: "POST",
                    body: new FormData(form),
                    headers: { 'Accept': 'application/json' }
                });

                if (response.ok) {
                    form.reset();
                    // 这里换成了更有温度的标题和提示语！
                    document.getElementById('modalTitle').innerText = title;
                    document.getElementById('modalMsg').innerText = msg;
                    modal.style.display = 'flex';
                    setTimeout(() => { modal.style.opacity = '1'; modalBox.style.transform = 'scale(1)'; }, 50);
                } else {
                    alert('信道干扰，请重试！');
                }
            } catch (error) {
                alert('网络连接失败！');
            } finally {
                btn.innerText = formId === 'preClassForm' ? '[ 点击发射 ] 预习侦察报告' : '[ 点击提交 ] 课后深度报告';
                btn.style.opacity = '1';
            }
        });
    };

    // ✨ 这里的文案变成了冬冬姨的专属鼓励！
    setupForm(
        'preClassForm', 
        'preBtn', 
        '叮！冬冬姨已经收到你的拉片笔记啦！你的洞察力真的很敏锐，好好休息，咱们周日见！',
        '预习完美通关！'
    );
    
    setupForm(
        'postClassForm', 
        'postBtn', 
        '太惊艳了！你的深度思考已经点亮了基地的灵感库，冬冬姨迫不及待想细细品读你的大作啦！',
        '灵感重构大成功！'
    );

    function closeModal() {
        document.getElementById('successModal').style.opacity = '0';
        document.getElementById('modalBox').style.transform = 'scale(0.8)';
        setTimeout(() => { document.getElementById('successModal').style.display = 'none'; }, 400);
    }
</script>
