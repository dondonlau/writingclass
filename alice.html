<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>灵感实验室 - Alice 进阶挑战</title>
    <style>
        :root {
            --studio-purple: #7209b7;
            --studio-pink: #f72585;
            --studio-blue: #4cc9f0;
            --glass-white: rgba(255, 255, 255, 0.9);
            --text-dark: #2b2d42;
            --mentor-gold: #ffd700;
        }

        body {
            margin: 0; padding: 20px; min-height: 100vh;
            background: linear-gradient(rgba(255, 255, 255, 0.6), rgba(255, 255, 255, 0.6)), url('bg-alice.jpg') no-repeat center center fixed; 
            background-size: cover;
            font-family: 'Inter', 'PingFang SC', sans-serif;
            color: var(--text-dark);
            line-height: 1.8;
        }

        .container { max-width: 900px; margin: 0 auto; }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .back-home { 
            display: inline-flex; align-items: center; gap: 10px; 
            padding: 10px 20px; background: white; border-radius: 50px; 
            text-decoration: none; color: var(--studio-purple); font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); transition: 0.3s;
        }

        .glass-card {
            background: var(--glass-white); backdrop-filter: blur(12px);
            border-radius: 24px; padding: 40px; border: 1px solid white;
            box-shadow: 0 20px 50px rgba(0,0,0,0.08); margin-bottom: 30px;
        }

        /* 导师点评区样式 */
        .mentor-review-box {
            background: rgba(114, 9, 183, 0.05);
            border: 2px solid var(--studio-purple);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 40px;
            position: relative;
        }
        .score-badge {
            position: absolute; top: -20px; right: 20px;
            background: var(--studio-pink); color: white;
            padding: 10px 25px; border-radius: 50px;
            font-weight: bold; font-size: 1.2rem;
            box-shadow: 0 5px 15px rgba(247, 37, 133, 0.3);
        }

        .evolution-task {
            background: white;
            padding: 20px;
            border-radius: 15px;
            border-left: 5px solid var(--studio-pink);
            margin-top: 15px;
        }

        .section-title { font-size: 1.5rem; font-weight: bold; color: var(--studio-purple); margin: 40px 0 25px; padding-bottom: 10px; border-bottom: 2px solid var(--studio-pink); display: flex; align-items: center; gap: 10px; }
        
        .question-card { margin-bottom: 25px; background: rgba(255,255,255,0.7); padding: 25px; border-radius: 18px; border-left: 5px solid var(--studio-blue); }
        
        .q-title { font-weight: 800; font-size: 1.1rem; color: var(--studio-purple); margin-bottom: 8px; display: block; }
        .alice-old-answer { background: #f0f0f0; padding: 10px 15px; border-radius: 8px; font-size: 0.95rem; color: #555; margin-bottom: 15px; border-left: 3px solid #ccc; }
        
        textarea {
            width: 100%; padding: 15px; border-radius: 12px; border: 1px solid #ddd;
            font-family: inherit; font-size: 1rem; resize: vertical; min-height: 100px;
            box-sizing: border-box; outline: none; transition: 0.3s;
        }
        textarea:focus { border-color: var(--studio-pink); box-shadow: 0 0 12px rgba(247, 37, 133, 0.1); }
